swagger: '2.0'
info:
  version: 1.0.0
  title: Worker Registry
  description: >
    This module facilitates maintenance of a campaign Worker registry.
  contact:
    name: Digit
    email: info@egovernments.org
schemes:
  - https
x-common-path: >-
  https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-0-0.yml
paths:
  /worker/v1/bulk/_create:
    post:
      summary: >-
        Create/Add Workers
      description: >-
        Create new Workers, along with their Individual mappings
      parameters:
        - name: Worker
          in: body
          description: Capture details of Workers.
          required: true
          schema:
            $ref: '#/definitions/WorkerBulkRequest'
      tags:
        - Worker
      responses:
        '200':
          description: Ok
          schema:
            $ref: '#/definitions/WorkerResponse'
        '400':
          description: Bad Request
          schema:
            $ref: >-
              https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes
        '500':
          description: Internal Server Error
          schema:
            $ref: >-
              https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes

  /worker/v1/bulk/_update:
    post:
      summary: >-
        Update the details of existing Workers
      description: >-
        Partially update existing Workers. Omitted fields retain their stored value.
      parameters:
        - name: Worker
          in: body
          description: Details for the Workers.
          required: true
          schema:
            $ref: '#/definitions/WorkerBulkRequest'
      tags:
        - Worker
      responses:
        '200':
          description: Ok
          schema:
            $ref: '#/definitions/WorkerResponse'
        '400':
          description: Bad Request
          schema:
            $ref: >-
              https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes
        '500':
          description: Internal Server Error
          schema:
            $ref: >-
              https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes

  /worker/v1/_search:
    post:
      summary: >-
        Search existing Workers
      description: >-
        Search existing Workers within a tenant. Not paginated.
      parameters:
        - name: Worker
          in: body
          description: Worker search criteria.
          required: true
          schema:
            $ref: '#/definitions/WorkerSearchRequest'
      tags:
        - Worker
      responses:
        '200':
          description: Ok
          schema:
            $ref: '#/definitions/WorkerResponse'
        '400':
          description: Bad Request
          schema:
            $ref: >-
              https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes
        '500':
          description: Internal Server Error
          schema:
            $ref: >-
              https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes

  /worker/v1/individual/bulk/_create:
    post:
      summary: >-
        Create/Add Worker to Individual mappings
      description: >-
        Link existing Workers to Individuals. Returns no mappings in the body.
      parameters:
        - name: WorkerIndividualMap
          in: body
          description: Capture details of Worker to Individual mappings.
          required: true
          schema:
            $ref: '#/definitions/WorkerIndividualMapBulkRequest'
      tags:
        - WorkerIndividualMap
      responses:
        '202':
          description: Accepted
          schema:
            $ref: >-
              https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ResponseInfo
        '400':
          description: Bad Request
          schema:
            $ref: >-
              https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes
        '500':
          description: Internal Server Error
          schema:
            $ref: >-
              https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ErrorRes

definitions:
  tenantId:
    $ref: 'https://raw.githubusercontent.com/digit-egov/health-api-specs/main/contracts/common.yaml#/definitions/tenantId'
  additionalFields:
    $ref: 'https://raw.githubusercontent.com/digit-egov/health-api-specs/main/contracts/common.yaml#/definitions/additionalFields'

  Worker:
    description: A representation of a campaign Worker.
    type: object
    required:
      - tenantId
      - name
      - paymentProvider
    properties:
      id:
        type: string
        minLength: 2
        maxLength: 64
        description: Generated by egov-idgen when not supplied. Required on update.
        example: 'WR-2026-000123'
      tenantId:
        $ref: '#/definitions/tenantId'
      name:
        type: string
        maxLength: 256
        description: Name of the worker. Encrypted at rest.
        example: 'Ana Mucavele'
      paymentProvider:
        type: string
        maxLength: 128
        description: Payment rail. BANK and MTN trigger provider-specific validation.
        example: 'BANK'
      payeeName:
        type: string
        maxLength: 256
        description: Required for BANK and MTN. Encrypted at rest.
        example: 'Ana Mucavele'
      payeePhoneNumber:
        type: string
        maxLength: 64
        description: Required for MTN. Encrypted at rest.
        example: '840000000'
      beneficiaryCode:
        type: string
        maxLength: 256
        pattern: '^[A-Za-z0-9]{1,35}$'
        description: Required for BANK. Encrypted at rest.
        example: 'BEN00012345'
      bankAccount:
        type: string
        maxLength: 256
        pattern: '^[0-9]{10}$'
        description: Required for BANK. Encrypted at rest.
        example: '1234567890'
      bankCode:
        type: string
        maxLength: 64
        pattern: '^$|^[0-9]{3}$|^[0-9]{9}$'
        description: Blank, 3 digits or 9 digits. Encrypted at rest.
        example: '001'
      photoId:
        type: string
        maxLength: 128
        description: Filestore service uuid holding the worker's photograph
        example: '8c7b6a5d-4e3f-2a1b-9c8d-7e6f5a4b3c2d'
      signatureId:
        type: string
        maxLength: 128
        description: Filestore service uuid holding the worker's signature
        example: '3f2a9e1c-7b5d-4a8e-9c1f-2d3e4f5a6b7c'
      individualIds:
        type: array
        description: Individual ids mapped to this worker. Mappings are written on create only.
        items:
          type: string
          maxLength: 64
      additionalDetails:
        type: object
        description: Free-form JSON, stored as jsonb.
      isDeleted:
        type: boolean
        default: false
        description: Soft-delete flag. Deleted workers are excluded from search.
      rowVersion:
        type: integer
        description: Optimistic-locking version. Must match the stored value on update.
        example: 1
      source:
        type: string
        description: Inherited from EgovModel. Not persisted.
      applicationId:
        type: string
        description: Inherited from EgovModel. Not persisted.
      hasErrors:
        type: boolean
        default: false
        description: Set by the bulk validation framework.
      additionalFields:
        $ref: '#/definitions/additionalFields'
      auditDetails:
        $ref: >-
          https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/AuditDetails

  WorkerSearch:
    description: Search criteria for a Worker.
    type: object
    required:
      - tenantId
    properties:
      tenantId:
        $ref: '#/definitions/tenantId'
      id:
        type: array
        description: Worker ids to match exactly.
        items:
          type: string
          minLength: 2
          maxLength: 64
      individualId:
        type: array
        description: Linked individual ids, resolved to workers via the mapping.
        items:
          type: string
          maxLength: 64
      name:
        type: string
        maxLength: 256
        description: Exact name match.
        example: 'Ana Mucavele'

  WorkerIndividualMap:
    description: A link between a Worker and an Individual.
    type: object
    required:
      - tenantId
      - workerId
      - individualId
    properties:
      id:
        type: string
        maxLength: 64
        description: Unique system generated GUID
        readOnly: true
      tenantId:
        $ref: '#/definitions/tenantId'
      workerId:
        type: string
        maxLength: 64
        description: Must reference an existing worker.
        example: 'WR-2026-000123'
      individualId:
        type: string
        maxLength: 64
        description: Must not already be mapped within the tenant.
        example: '8b2c3d4e-5f6a-7b8c-9d0e-1f2a3b4c5d6e'
      isDeleted:
        type: boolean
        default: false
      auditDetails:
        $ref: >-
          https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/AuditDetails

  WorkerBulkRequest:
    type: object
    properties:
      RequestInfo:
        $ref: >-
          https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/RequestInfo
      workers:
        type: array
        minItems: 1
        items:
          $ref: '#/definitions/Worker'
    required:
      - RequestInfo
      - workers

  WorkerSearchRequest:
    type: object
    properties:
      RequestInfo:
        $ref: >-
          https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/RequestInfo
      workerSearch:
        $ref: '#/definitions/WorkerSearch'
    required:
      - RequestInfo
      - workerSearch

  WorkerIndividualMapBulkRequest:
    type: object
    properties:
      RequestInfo:
        $ref: >-
          https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/RequestInfo
      workerIndividualMaps:
        type: array
        minItems: 1
        items:
          $ref: '#/definitions/WorkerIndividualMap'
    required:
      - RequestInfo
      - workerIndividualMaps

  WorkerResponse:
    type: object
    properties:
      responseInfo:
        $ref: >-
          https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/ResponseInfo
      workers:
        type: array
        items:
          $ref: '#/definitions/Worker'
    required:
      - responseInfo
