server.servlet.context-path=/household
server.port=8080
app.timezone=UTC

# REDIS CONFIG
spring.redis.host=localhost
spring.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=60
spring.cache.autoexpiry=true

# DATABASE CONFIG
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres

# FLYWAY CONFIG
spring.flyway.url=jdbc:postgresql://localhost:5432/postgres
spring.flyway.user=postgres
spring.flyway.password=postgres
spring.flyway.table=public
spring.flyway.baseline-on-migrate=true
spring.flyway.outOfOrder=true
spring.flyway.locations=classpath:/db/migration/main
spring.flyway.enabled=false

# TRACER CONFIG
# KAFKA SERVER CONFIG
kafka.config.bootstrap_server_config=localhost:9092
spring.kafka.consumer.value-deserializer=org.egov.tracer.kafka.deserializer.HashMapDeserializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=household
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# KAFKA CONSUMER CONFIG
kafka.consumer.config.auto_commit=true
kafka.consumer.config.auto_commit_interval=100
kafka.consumer.config.session_timeout=15000
kafka.consumer.config.auto_offset_reset=earliest

# KAFKA PRODUCER CONFIG
kafka.producer.config.retries_config=0
kafka.producer.config.batch_size_config=16384
kafka.producer.config.linger_ms_config=1
kafka.producer.config.buffer_memory_config=33554432

# IDGEN CONFIG
#egov.idgen.host=https://dev.digit.org/
egov.idgen.host=http://localhost:8082/
egov.idgen.path=egov-idgen/id/_generate
egov.idgen.integration.enabled=true
household.idgen.id.format=household.id

# The value of the following field should be changed to service specific name
kafka.topics.consumer=household-consumer-topic

# USER CONFIG
#egov.user.host=https://dev.digit.org
egov.user.host=http://localhost:8083/
egov.user.context.path=/user/users
egov.user.create.path=/_createnovalidate
egov.user.search.path=/user/_search
egov.user.update.path=/_updatenovalidate

# MDMS CONFIG
egov.mdms.host=https://dev.digit.org
egov.mdms.search.endpoint=/egov-mdms-service/v1/_search
egov.mdms.master.name=
egov.mdms.module.name=
egov.mdms.integration.enabled=false

#----------------enc-client config---------------------#
# enc-client reads egov.mdms.host / egov.mdms.search.endpoint above, and these
state.level.tenant.id=default
egov.enc.host=http://egov-enc-service:8080
egov.enc.encrypt.endpoint=/egov-enc-service/crypto/v1/_encrypt
egov.enc.decrypt.endpoint=/egov-enc-service/crypto/v1/_decrypt

household.consumer.bulk.delete.topic=delete-household-bulk-topic
household.consumer.bulk.create.topic=create-household-bulk-topic
household.consumer.bulk.update.topic=update-household-bulk-topic

household.kafka.create.topic=save-household-topic
household.kafka.update.topic=update-household-topic
household.kafka.delete.topic=delete-household-topic

# HOUSEHOLD KAFKA CONFIG
h.kafka.create.topic=save-household-topic
h.kafka.update.topic=update-household-topic

# HOUSEHOLD MEMBER KAFKA CONFIG
household.member.kafka.create.topic=save-household-member-topic
household.member.kafka.update.topic=update-household-member-topic
household.member.kafka.delete.topic=delete-household-member-topic

household.member.consumer.bulk.create.topic=household-member-consumer-bulk-create-topic
household.member.consumer.bulk.update.topic=household-member-consumer-bulk-update-topic
household.member.consumer.bulk.delete.topic=household-member-consumer-bulk-delete-topic

# INDIVIDUAL SERVICE
egov.individual.host=https://dev.digit.org
egov.individual.search.url=/individual/v1/_search


# BOUNDARY SERVICE
egov.boundary.host=http://localhost:8081
egov.boundary.search.url=/boundary-service/boundary/_search
egov.boundary.hierarchy=HCM-Moz-Hierarchy

#Community Household Type
household.type.same.validation=true
# false = skip cross-entity existence checks (household/individual/relative) on member create/update; set true to enforce
household.member.relationship.validation=false
household.type.community.creator.role=COMMUNITY_CREATOR

# Central Instance Multi Tenancy
state.level.tenantid.length=1
state.schema.index.position.tenantid=0
is.environment.central.instance=false

otel.traces.exporter=none
otel.logs.exporter=none
otel.metrics.exporter=none

#----------------PII encryption at rest (address text fields)----------------#
# MDMS DataSecurity.SecurityPolicy models for the address values (attribute "value"); decrypt uniqueIdentifier "/ownerId"
household.pii.encrypt.model=HouseholdPiiEncrypt
household.pii.decrypt.model=HouseholdPiiDecrypt
# Bulk Kafka envelope: ENCRYPTED_ONLY (enc-service down -> HTTP 503) or ALLOW_PLAIN (plain request to a restricted DLQ, HTTP 202)
household.bulk.envelope.dlq.mode=ENCRYPTED_ONLY
household.bulk.dlq.topic=household-bulk-dlq-topic
# wait after a failed DLQ replay before the message is parked again
household.bulk.dlq.retry.backoff.ms=5000
# an envelope enc-service refuses to open is tried again later and later (the wait doubles), at most this far apart
household.bulk.dlq.retry.max.backoff.ms=3600000
# timeouts of the shared HTTP client (enc-client, MDMS, user, idgen, boundary, individual and every other outgoing call)
household.http.connect.timeout.ms=2000
household.http.read.timeout.ms=60000
# timeouts of the bulk envelope calls to enc-service
household.enc.connect.timeout.ms=2000
household.enc.read.timeout.ms=10000
household.enc.circuit.failure.threshold=5
household.enc.circuit.open.ms=30000

#----------------Shared PII encryption classes (org.egov.common.pii in health-services-common)----------------#
# Opt-in: the library creates none of its beans unless egov.pii.encryption.enabled=true.
egov.pii.encryption.enabled=true
# household has no searched PII, so no search hash columns and no hasher bean
egov.pii.hash.enabled=false
# The library reads the egov.* names; each maps the household.* property above, with the same default (same as individual).
egov.bulk.envelope.dlq.mode=${household.bulk.envelope.dlq.mode:ENCRYPTED_ONLY}
egov.bulk.dlq.topic=${household.bulk.dlq.topic:household-bulk-dlq-topic}
egov.bulk.dlq.retry.backoff.ms=${household.bulk.dlq.retry.backoff.ms:5000}
egov.bulk.dlq.retry.max.backoff.ms=${household.bulk.dlq.retry.max.backoff.ms:3600000}
egov.http.connect.timeout.ms=${household.http.connect.timeout.ms:2000}
egov.http.read.timeout.ms=${household.http.read.timeout.ms:60000}
egov.enc.connect.timeout.ms=${household.enc.connect.timeout.ms:2000}
egov.enc.read.timeout.ms=${household.enc.read.timeout.ms:10000}
egov.enc.circuit.failure.threshold=${household.enc.circuit.failure.threshold:5}
egov.enc.circuit.open.ms=${household.enc.circuit.open.ms:30000}
