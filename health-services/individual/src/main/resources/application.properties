server.servlet.context-path=/individual
server.port=8080
app.timezone=UTC

spring.main.allow-bean-definition-overriding=true

# REDIS CONFIG
spring.redis.host=localhost
spring.redis.port=6379
spring.cache.type=redis
# Seconds
spring.cache.redis.time-to-live=60
spring.cache.autoexpiry=true

# DATABASE CONFIG
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres

# FLYWAY CONFIG
spring.flyway.url=jdbc:postgresql://localhost:5432/postgres
spring.flyway.user=postgres
spring.flyway.password=postgres
spring.flyway.table=public
spring.flyway.baseline-on-migrate=true
spring.flyway.outOfOrder=true
spring.flyway.locations=classpath:/db/migration/main
spring.flyway.enabled=true

# TRACER CONFIG
# KAFKA SERVER CONFIG
kafka.config.bootstrap_server_config=localhost:9092
spring.kafka.consumer.value-deserializer=org.egov.tracer.kafka.deserializer.HashMapDeserializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=individual
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# KAFKA CONSUMER CONFIG
kafka.consumer.config.auto_commit=true
kafka.consumer.config.auto_commit_interval=100
kafka.consumer.config.session_timeout=15000
kafka.consumer.config.auto_offset_reset=earliest

# KAFKA PRODUCER CONFIG
kafka.producer.config.retries_config=0
kafka.producer.config.batch_size_config=16384
kafka.producer.config.linger_ms_config=1
kafka.producer.config.buffer_memory_config=33554432

# IDGEN CONFIG
egov.idgen.host=https://dev.digit.org/
egov.idgen.path=egov-idgen/id/_generate
egov.idgen.integration.enabled=true
idgen.individual.id.format=individual.id


# Beneficiary ID-GEN CONFIG (This is only used by to dispatch the id to the APK)
egov.beneficiary.idgen.host=http://localhost:8088/
egov.beneficiary.idgen.idpool.search.path=beneficiary-idgen/id/id_pool/_search
egov.beneficiary.idgen.idpool.update.path=beneficiary-idgen/id/id_pool/_update
egov.beneficiary.idgen.integration.enabled=true

individual.beneficiary.id.validation.enabled=false
individual.beneficiary.id.length=12

#----------------enc-client config---------------------#
egov.mdms.host=https://works-dev.digit.org
egov.mdms.search.endpoint=/egov-mdms-service/v1/_search
state.level.tenant.id=default
egov.enc.host=https://works-dev.digit.org
egov.enc.encrypt.endpoint=/egov-enc-service/crypto/v1/_encrypt
egov.enc.decrypt.endpoint=/egov-enc-service/crypto/v1/_decrypt

# The value of the following field should be changed to service specific name
individual.consumer.bulk.create.topic=individual-consumer-bulk-create-topic
individual.consumer.bulk.update.topic=individual-consumer-bulk-update-topic
individual.consumer.bulk.delete.topic=individual-consumer-bulk-delete-topic
individual.producer.save.topic=save-individual-topic
individual.producer.update.topic=update-individual-topic
individual.producer.delete.topic=delete-individual-topic
individual.producer.update.user.id.topic=update-user-id-topic

#RegEx pattern for aadhar number and mobile number
aadhaar.pattern=\\d{12}
mobile.pattern=\\d+

# User service integration properties
egov.user.host=https://health-dev.digit.org
egov.create.user.url=/user/users/_createnovalidate
egov.search.user.url=/user/_search
egov.update.user.url=/user/users/_updatenovalidate
egov.bulk.create.user.url=/user/users/v2/_create
egov.user.integration.enabled=true
user.sync.enabled=true
user.service.user.type=CITIZEN
user.service.account.locked=false

#Notification
notification.sms.enabled=true
kafka.topics.notification.sms=egov.core.notification.sms
notification.sms.disabled.roles=ORG_ADMIN

#Localization config
egov.localization.host=https://works-dev.digit.org/
egov.localization.context.path=localization/messages/v1
egov.localization.search.endpoint=/_search
egov.localization.statelevel=true

# BOUNDARY SERVICE
egov.boundary.host=http://localhost:8081
egov.boundary.search.url=/boundary-service/boundary/_search
egov.boundary.hierarchy=HCM-Moz-Hierarchy

# Central Instance Multi Tenancy
state.level.tenantid.length=1
state.schema.index.position.tenantid=0
is.environment.central.instance=false

# OpenTelemetry configuration
otel.traces.exporter=none
otel.logs.exporter=none
otel.metrics.exporter=none


#----------------PII encryption at rest----------------#
# HMAC secret for the search hash columns: one per environment, from a k8s/SOPS secret, never rotated.
individual.pii.hash.secret=${PII_HASH_SECRET:}
# MDMS DataSecurity.SecurityPolicy models for the PII values (attribute "value"); decrypt uniqueIdentifier "/ownerId"
individual.pii.encrypt.model=IndividualPiiEncrypt
# decrypt model (attribute "value", uniqueIdentifier "/ownerId")
individual.pii.decrypt.model=IndividualPiiDecrypt
# additionalFields keys holding health data (stored encrypted)
individual.pii.additional.fields.keys=weight,height,isPregnant
# Bulk Kafka envelope: ENCRYPTED_ONLY (enc-service down -> HTTP 503) or ALLOW_PLAIN (plain request to a restricted DLQ, HTTP 202)
individual.bulk.envelope.dlq.mode=ENCRYPTED_ONLY
individual.bulk.dlq.topic=individual-bulk-dlq-topic
# one-time re-index of the stored (encrypted) individuals into ES, after the backfill; off by default, run as a one-off job
individual.reindex.enabled=false
individual.reindex.topic=
individual.reindex.batch=100
# wait after a failed DLQ replay before the message is parked again
individual.bulk.dlq.retry.backoff.ms=5000
# an envelope enc-service refuses to open is tried again later and later (the wait doubles), at most this far apart
individual.bulk.dlq.retry.max.backoff.ms=3600000
# timeouts of the shared HTTP client (enc-client, MDMS, user, idgen and every other outgoing call)
individual.http.connect.timeout.ms=2000
individual.http.read.timeout.ms=60000
# timeouts of the bulk envelope calls to enc-service
individual.enc.connect.timeout.ms=2000
individual.enc.read.timeout.ms=10000
individual.enc.circuit.failure.threshold=5
individual.enc.circuit.open.ms=30000

#----------------Shared PII encryption classes (org.egov.common.pii in health-services-common)----------------#
# Opt-in: the library creates none of its beans unless egov.pii.encryption.enabled=true.
egov.pii.encryption.enabled=true
# the search hasher is a second opt-in (not every service hashes)
egov.pii.hash.enabled=true
# fields lower-cased before hashing (names match case-insensitively)
egov.pii.hash.lowercase.fields=givenName
# The library reads the egov.* names; each maps the individual.* property above, with the same default,
# so every existing env var keeps working (PII_HASH_SECRET, INDIVIDUAL_BULK_ENVELOPE_DLQ_MODE, INDIVIDUAL_BULK_DLQ_TOPIC, ...).
egov.pii.hash.secret=${individual.pii.hash.secret:}
egov.bulk.envelope.dlq.mode=${individual.bulk.envelope.dlq.mode:ENCRYPTED_ONLY}
egov.bulk.dlq.topic=${individual.bulk.dlq.topic:individual-bulk-dlq-topic}
egov.bulk.dlq.retry.backoff.ms=${individual.bulk.dlq.retry.backoff.ms:5000}
egov.bulk.dlq.retry.max.backoff.ms=${individual.bulk.dlq.retry.max.backoff.ms:3600000}
egov.http.connect.timeout.ms=${individual.http.connect.timeout.ms:2000}
egov.http.read.timeout.ms=${individual.http.read.timeout.ms:60000}
egov.enc.connect.timeout.ms=${individual.enc.connect.timeout.ms:2000}
egov.enc.read.timeout.ms=${individual.enc.read.timeout.ms:10000}
egov.enc.circuit.failure.threshold=${individual.enc.circuit.failure.threshold:5}
egov.enc.circuit.open.ms=${individual.enc.circuit.open.ms:30000}
