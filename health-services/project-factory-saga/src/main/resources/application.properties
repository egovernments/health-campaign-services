server.servlet.context-path=/project-factory
server.port=8080
app.timezone=UTC

# ---- Redis ----
spring.redis.host=localhost
spring.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=60
spring.cache.autoexpiry=true

# ---- Datasource ----
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres

# ---- Flyway (single-target; per-tenant schema provisioning is external, see context/06) ----
spring.flyway.url=jdbc:postgresql://localhost:5432/postgres
spring.flyway.user=postgres
spring.flyway.password=postgres
spring.flyway.table=pf_saga_schema_version
spring.flyway.baseline-on-migrate=true
spring.flyway.outOfOrder=true
spring.flyway.locations=classpath:/db/migration/main
spring.flyway.enabled=true

# ---- Kafka ----
kafka.config.bootstrap_server_config=localhost:9092
spring.kafka.consumer.value-deserializer=org.egov.tracer.kafka.deserializer.HashMapDeserializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=project-factory-saga
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.consumer.properties.spring.json.use.type.headers=false
kafka.consumer.config.auto_commit=true
kafka.consumer.config.auto_commit_interval=100
kafka.consumer.config.session_timeout=15000
kafka.consumer.config.auto_offset_reset=earliest
kafka.producer.config.retries_config=0
kafka.producer.config.batch_size_config=16384
kafka.producer.config.linger_ms_config=1
kafka.producer.config.buffer_memory_config=33554432

# ---- Multi-tenancy (platform MultiStateInstanceUtil; keep false until central-instance rollout) ----
is.environment.central.instance=false
state.level.tenantid.length=1
state.schema.index.position.tenantid=0
kafka.tenant.id.pattern=[a-zA-Z]+-

# ---- Downstream services ----
egov.mdms.host=https://dev.digit.org
egov.mdms.search.endpoint=/egov-mdms-service/v1/_search
egov.boundary.host=http://localhost:8081
egov.boundary.search.url=/boundary-service/boundary/_search
egov.filestore.host=http://localhost:8082

# ---- Search / paging ----
search.api.limit=100

# ---- Saga engine tunables (see context/03-saga-lld) ----
pf.saga.reaper.sla.seconds=900
pf.saga.reaper.fixed.delay.ms=30000
pf.saga.step.max.attempts=5
pf.batch.validation.chunk.size=200
pf.batch.upsert.size=500

# ---- Actuator / observability ----
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.tags.application=project-factory-saga

# ---- Virtual threads (Java 25; core scaling model per ADR-002) ----
spring.threads.virtual.enabled=true
