# HCM frontend reverse proxy.
# Provides a single-origin entrypoint for:
#   - the DIGIT UIs (payments-ui, workbench-ui)
#   - all API calls (forwarded to the DIGIT gateway)
#   - a local /digit-ui-assets/ static path used by the injected globalConfigs.

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 50m;

    # ---- Local asset bundle (globalConfigs JS + any other static helpers) ----
    location /digit-ui-assets/ {
        alias /usr/share/nginx/html/digit-ui-assets/;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # ---- UI containers (each is an nginx serving its own SPA on :80) ----
    location /payments-ui/ {
        proxy_pass http://payments-ui:80/payments-ui/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /workbench-ui/ {
        proxy_pass http://workbench-ui:80/workbench-ui/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Convenience landing page: redirect / to workbench employee ----
    location = / {
        return 302 /workbench-ui/employee;
    }

    # ---- Memory workaround, not 2.9 behaviour ----
    # The Workbench UI makes one fallback localization search with no `module`. egov-localization
    # answers it by loading every message for the locale (~73k rows) at once, which needs a ~4 GB heap.
    # That call is answered here with an empty list so the service can run on 512 MB.
    # Searches that name a module go to the gateway unchanged.
    location = /localization/messages/v1/_search {
        if ($arg_module = "") {
            add_header Content-Type application/json always;
            add_header X-Local-Setup "empty-module localization search answered by frontend-proxy.conf" always;
            return 200 '{"messages":[]}';
        }
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ---- Everything else is treated as an API call -> DIGIT gateway ----
    location / {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ---- Liveness probe ----
    location = /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
