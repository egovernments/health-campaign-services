# Routes for the DIGIT gateway (Digit-Core core-services/gateway): path prefix -> service.
# The path is passed on unchanged. No rate limiter is configured: every local request comes from
# one address, so a per-address limit would only get in the way of tests.

spring.cloud.gateway.routes[0].id=mdms-v2
spring.cloud.gateway.routes[0].uri=http://egov-mdms-service:8094
spring.cloud.gateway.routes[0].predicates[0]=Path=/mdms-v2/**

