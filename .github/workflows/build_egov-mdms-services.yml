name: Build and push egov-mdms-services image

# Least-privilege default for GITHUB_TOKEN. Jobs that need more must
# request it explicitly at the job level.
permissions:
  contents: read

on:
  push:
    paths:
      - 'core-services/egov-mdms-service/**'
    branches:
      - build_test

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: benjlevesque/short-sha@599815c8ee942a9616c92bcfb4f947a3b670ab0b # v3.0
      id: short-sha
      with:
        length: 6
    - run: echo $SHA
      env: 
        SHA: ${{ steps.short-sha.outputs.sha }}
    - run: echo $SHA
      env: 
        SHA: ${{ env.SHA }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

    - name: Log in to registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ secrets.GHCR_PASSWORD_SECRET }}
        password: ${{ secrets.GHCR_USERNAME_SECRET }} 

    - name: Build and push
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
          context: ./core-services/egov-mdms-service
          file: ./egov-mdms-service
          push: true
          tags: egovernments/egov-mdms-service:v2-${{ env.SHA }}
