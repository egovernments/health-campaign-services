# This workflow uses actions that are not certified by GitHub. They are provided
# by a third-party and are governed by separate terms of service, privacy
# policy, and support documentation.

# Trivy security scanning:
#   1. filesystem-scan   - scans the whole repo for vulnerable dependencies (npm/maven/pip)
#                           and leaked secrets.
#   2. discover-dockerfiles / image-scan - builds and scans Docker images with Trivy.
#                           On pull requests, only Dockerfiles changed in the PR are built
#                           to keep CI fast. On push to master, schedule, and manual runs,
#                           every Dockerfile in the repo is built and scanned.
# All scans are report-only: results are uploaded to the GitHub Security tab
# (Code scanning alerts) and never fail the build.

name: Trivy Security Scan

on:
  pull_request:
    branches: [ "master" ]
  push:
    branches: [ "master" ]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  filesystem-scan:
    name: Filesystem & Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run Trivy filesystem & secret scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: sarif
          output: trivy-fs-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: 0

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: trivy-fs-results
          path: trivy-fs-results.sarif
          retention-days: 5

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs

  discover-dockerfiles:
    name: Discover Dockerfiles to scan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Determine Dockerfiles to scan
        id: set-matrix
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            mapfile -t FILES < <(git diff --name-only "$BASE_SHA" HEAD -- '**/Dockerfile' | sort -u)
          else
            mapfile -t FILES < <(find . -iname "Dockerfile" -not -path "*/node_modules/*" | sed 's|^\./||' | sort -u)
          fi

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
          else
            JSON=$(printf '%s\n' "${FILES[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
          fi

  image-scan:
    name: Image scan (${{ matrix.dockerfile }})
    needs: discover-dockerfiles
    if: needs.discover-dockerfiles.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        dockerfile: ${{ fromJson(needs.discover-dockerfiles.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Compute image tag
        id: vars
        run: |
          SAFE_NAME=$(echo "${{ matrix.dockerfile }}" | tr '/.' '__')
          echo "context=$(dirname "${{ matrix.dockerfile }}")" >> "$GITHUB_OUTPUT"
          echo "tag=trivy-scan/${SAFE_NAME}:latest" >> "$GITHUB_OUTPUT"
          echo "category=trivy-image-${SAFE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build image
        id: build
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.vars.outputs.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ steps.vars.outputs.tag }}

      - name: Run Trivy image scan
        if: steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.vars.outputs.tag }}
          format: sarif
          output: trivy-image-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: 0

      - name: Upload SARIF artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: trivy-image-${{ steps.vars.outputs.category }}
          path: trivy-image-results.sarif
          retention-days: 5

      - name: Upload SARIF to code scanning
        if: steps.build.outcome == 'success'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-results.sarif
          category: ${{ steps.vars.outputs.category }}
