name: Build Campaign Data Analysis Report

# Mirrors build-hcm-custom-reports.yml: same tag scheme (<branch>-<short-sha>),
# same egovio registry, same per-arch build then joined manifest.
#
# Rebuild is required when requirements.txt, the pipeline, dst_common or main.py
# change. DAG-only changes need NO rebuild - git-sync picks those up.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - airflow-analysis
    paths:
      - 'utilities/campaign-data-analysis-report/**'
      - 'utilities/airflow-dags/dags/dst_common/**'
      - '.github/workflows/build-campaign-data-analysis-report.yml'

env:
  DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_ACCESS_TOKEN }}
  IMAGE_NAME: campaign-data-analysis-report

jobs:
  generate-tag:
    name: Generate Docker Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.generate-tag.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Tag
        id: generate-tag
        run: |
          BRANCH="${GITHUB_REF##*/}"
          COMMIT_HASH=$(git rev-parse --short HEAD)
          TAG="${BRANCH}-${COMMIT_HASH}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Generated tag: $TAG"

  build-and-push:
    name: Build and Push ${{ matrix.arch }}
    needs: generate-tag
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # dst_common lives with the DAGs, outside this image's build context. Stage
      # it in rather than duplicating it in git or building from the repo root
      # (which would send ~9,500 files, including a committed venv, as context).
      - name: Stage dst_common into the build context
        run: |
          cp -r utilities/airflow-dags/dags/dst_common \
                utilities/campaign-data-analysis-report/dst_common
          echo "staged $(find utilities/campaign-data-analysis-report/dst_common -name '*.py' | wc -l) modules"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker Layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-${{ matrix.arch }}-buildx-campaign-data-analysis-report-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-buildx-campaign-data-analysis-report-

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --file utilities/campaign-data-analysis-report/Dockerfile \
            --tag egovio/${{ env.IMAGE_NAME }}:${{ needs.generate-tag.outputs.tag }}-${{ matrix.arch }} \
            --provenance=false \
            --sbom=false \
            --cache-from=type=local,src=/tmp/.buildx-cache \
            --cache-to=type=local,dest=/tmp/.buildx-cache,mode=max \
            --push \
            utilities/campaign-data-analysis-report

      - name: Inspect Image
        run: |
          docker buildx imagetools inspect egovio/${{ env.IMAGE_NAME }}:${{ needs.generate-tag.outputs.tag }}-${{ matrix.arch }}

  create-manifest:
    name: Create Multi-arch Manifest
    needs: [generate-tag, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Create and Push Manifest
        run: |
          docker manifest create egovio/${{ env.IMAGE_NAME }}:${{ needs.generate-tag.outputs.tag }} \
            --amend egovio/${{ env.IMAGE_NAME }}:${{ needs.generate-tag.outputs.tag }}-amd64 \
            --amend egovio/${{ env.IMAGE_NAME }}:${{ needs.generate-tag.outputs.tag }}-arm64
          docker manifest push egovio/${{ env.IMAGE_NAME }}:${{ needs.generate-tag.outputs.tag }}

      - name: Create and Push Latest Tag (if main branch)
        if: github.ref == 'refs/heads/main'
        run: |
          docker manifest create egovio/${{ env.IMAGE_NAME }}:latest \
            --amend egovio/${{ env.IMAGE_NAME }}:${{ needs.generate-tag.outputs.tag }}-amd64 \
            --amend egovio/${{ env.IMAGE_NAME }}:${{ needs.generate-tag.outputs.tag }}-arm64
          docker manifest push egovio/${{ env.IMAGE_NAME }}:latest

      - name: Summary
        run: |
          echo "### Docker Image Built Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: egovio/${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: ${{ needs.generate-tag.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Set the Airflow Variable **DST_REPORT_IMAGE** to:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "egovio/${{ env.IMAGE_NAME }}:${{ needs.generate-tag.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
